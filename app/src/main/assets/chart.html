<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090e16;overflow:hidden;color:#dce6f3;font:12px Arial}
#wrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column}#tools{height:42px;display:flex;gap:5px;align-items:center;padding:4px;background:#101a28;overflow-x:auto;flex-shrink:0}
button{background:#1c2b3e;color:#dce6f3;border:1px solid #2b4059;border-radius:5px;padding:7px 9px;white-space:nowrap}button.active{background:#176b60;border-color:#20c997}
#stage{position:relative;flex:1;min-height:0}#chart{position:absolute;inset:0}#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none}
</style><script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script></head>
<body><div id="wrap"><div id="tools">
<button data-tool="cursor" class="active">Cursor</button><button data-tool="move">Move</button><button data-tool="hline">Horizontal</button><button data-tool="trend">Trendline</button><button data-tool="rect">Rectangle</button><button id="lock">Unlock</button><button id="del">Delete</button><button id="clear">Clear</button>
</div><div id="stage"><div id="chart"></div><canvas id="draw"></canvas></div></div>
<script>
const el=document.getElementById('chart'), canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');
let chart=null,series=null,tool='cursor',shapes=[],draft=null,selected=-1,locked=false,dragging=false,dragStart=null;
function init(){if(!window.LightweightCharts||chart)return;chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:el.clientHeight,layout:{background:{type:'solid',color:'#090e16'},textColor:'#9aa8ba'},grid:{vertLines:{color:'#172231'},horzLines:{color:'#172231'}},rightPriceScale:{borderColor:'#263448'},timeScale:{borderColor:'#263448',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true}});series=chart.addSeries(LightweightCharts.CandlestickSeries,{upColor:'#20c997',downColor:'#ef5350',borderUpColor:'#20c997',borderDownColor:'#ef5350',wickUpColor:'#20c997',wickDownColor:'#ef5350'});new ResizeObserver(resize).observe(document.getElementById('stage'));resize()}
function resize(){if(!chart)return;chart.applyOptions({width:el.clientWidth,height:el.clientHeight});canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);paint()}
function setCandles(items){init();if(series){series.setData(items);chart.timeScale().fitContent()}}
function updateCandle(item){init();if(series)series.update(item)}
function xy(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function paint(){if(!ctx)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);const drawOne=(s,i)=>{ctx.strokeStyle=i===selected?'#ffd166':'#43b8ff';ctx.lineWidth=i===selected?2:1.5;ctx.setLineDash(s.type==='hline'?[5,4]:[]);ctx.beginPath();if(s.type==='hline'){ctx.moveTo(0,s.y1);ctx.lineTo(canvas.clientWidth,s.y1)}else if(s.type==='rect'){ctx.rect(s.x1,s.y1,s.x2-s.x1,s.y2-s.y1)}else{ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2)}ctx.stroke();ctx.setLineDash([])};shapes.forEach(drawOne);if(draft)drawOne(draft,-1)}
function hit(p){for(let i=shapes.length-1;i>=0;i--){const s=shapes[i],minX=Math.min(s.x1,s.x2),maxX=Math.max(s.x1,s.x2),minY=Math.min(s.y1,s.y2),maxY=Math.max(s.y1,s.y2);if(s.type==='hline'&&Math.abs(p.y-s.y1)<10)return i;if(s.type==='rect'&&p.x>=minX-8&&p.x<=maxX+8&&p.y>=minY-8&&p.y<=maxY+8)return i;if(s.type==='trend'){const dx=s.x2-s.x1,dy=s.y2-s.y1,t=dx===0?0:(p.x-s.x1)/dx,yy=s.y1+t*dy;if(t>=-.05&&t<=1.05&&Math.abs(p.y-yy)<10)return i}}return -1}
canvas.addEventListener('pointerdown',e=>{const p=xy(e);canvas.setPointerCapture(e.pointerId);if(tool==='cursor'||tool==='move'){selected=hit(p);if(tool==='move'&&selected>=0&&!locked){dragging=true;dragStart=p;draft=JSON.parse(JSON.stringify(shapes[selected]))}paint();return}draft={type:tool==='hline'?'hline':tool,x1:p.x,y1:p.y,x2:p.x,y2:p.y};paint()});
canvas.addEventListener('pointermove',e=>{if(!draft)return;const p=xy(e);if(dragging&&selected>=0){const dx=p.x-dragStart.x,dy=p.y-dragStart.y,s=shapes[selected];s.x1=draft.x1+dx;s.x2=draft.x2+dx;s.y1=draft.y1+dy;s.y2=draft.y2+dy}else{draft.x2=p.x;draft.y2=tool==='hline'?draft.y1:p.y}paint()});
canvas.addEventListener('pointerup',()=>{if(dragging){dragging=false;draft=null;paint();return}if(draft){if(tool==='hline')draft.y2=draft.y1;shapes.push(draft);draft=null;selected=shapes.length-1;paint()}});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));canvas.style.pointerEvents=(tool==='cursor')?'none':'auto';});
document.getElementById('lock').onclick=e=>{locked=!locked;e.target.textContent=locked?'Locked':'Unlock'};
document.getElementById('del').onclick=()=>{if(selected>=0){shapes.splice(selected,1);selected=-1;paint()}};
document.getElementById('clear').onclick=()=>{shapes=[];selected=-1;paint()};
window.setCandles=setCandles;window.updateCandle=updateCandle;setTimeout(init,120);
</script></body></html>
