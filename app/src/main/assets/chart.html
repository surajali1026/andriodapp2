<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body,#chart{margin:0;width:100%;height:100%;background:#090e16;overflow:hidden}
</style>
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="chart"></div>
<script>
const el=document.getElementById('chart');
let chart=null, series=null;
function init(){
 if(!window.LightweightCharts)return;
 chart=LightweightCharts.createChart(el,{
  width:el.clientWidth,height:el.clientHeight,
  layout:{background:{type:'solid',color:'#090e16'},textColor:'#9aa8ba'},
  grid:{vertLines:{color:'#172231'},horzLines:{color:'#172231'}},
  rightPriceScale:{borderColor:'#263448'},
  timeScale:{borderColor:'#263448',timeVisible:true,secondsVisible:false},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal}
 });
 series=chart.addSeries(LightweightCharts.CandlestickSeries,{
  upColor:'#20c997',downColor:'#ef5350',borderUpColor:'#20c997',borderDownColor:'#ef5350',
  wickUpColor:'#20c997',wickDownColor:'#ef5350'
 });
 new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight})).observe(el);
}
function setCandles(items){
 if(!series){init();}
 if(series) {series.setData(items);chart.timeScale().fitContent();}
}
function updateCandle(item){if(!series){init();}if(series)series.update(item);}
window.setCandles=setCandles;
window.updateCandle=updateCandle;
setTimeout(init,150);
</script>
</body>
</html>
